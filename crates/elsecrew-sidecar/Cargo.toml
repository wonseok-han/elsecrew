[package]
name = "elsecrew-sidecar"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# Explicit QA builds only. Standard release packaging does not enable this.
qa-output-fixtures = []

[dependencies]
serde = "=1.0.228"
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
elsecrew-core = { path = "../elsecrew-core" }
elsecrew-protocol = { path = "../elsecrew-protocol" }
cap-fs-ext = { version = "=3.4.5", default-features = false }
cap-std = { version = "=3.4.5", default-features = false }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde_json = "=1.0.150"
sha2 = { version = "=0.10.9", default-features = false }
sha1 = { version = "=0.10.6", default-features = false }
uuid = { version = "=1.24.0", features = ["v4"] }

unicode-normalization = "=0.1.25"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
security-framework = "=3.7.0"
