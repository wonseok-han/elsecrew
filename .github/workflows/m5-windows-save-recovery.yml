name: M5 Windows save recovery (diagnostic only)

on:
  push:
    branches:
      - codex/m5-windows-save-recovery-20261105

permissions:
  contents: read

jobs:
  save-recovery:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      RUST_TEST_THREADS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Require compiled save and recovery regressions
        shell: pwsh
        run: |
          $tests = cargo test --locked --release -p hello-agent-sidecar --lib -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $required = @(
            'project::windows_replace::tests::replacement_is_relative_to_pinned_parent_and_preserves_guard',
            'project::windows_remove::tests::cleanup_requires_exact_identity_and_preserves_guard_and_foreign_files',
            'project::windows_durability::tests::ntfs_write_through_source_can_be_flushed_after_handle_relative_rename',
            'project::windows_security::tests::replacement_preserves_inherited_access_in_same_parent',
            'project::windows_security::tests::replacement_preserves_protected_access_descriptor_without_changing_old_file',
            'project::windows_save_recovery::tests::preparing_original_identity_is_used_before_replace_intent',
            'project::windows_save_recovery::tests::same_content_with_different_identity_is_not_original',
            'project::windows_save_recovery::tests::oversized_recovery_artifact_is_rejected',
            'project::windows_save_cleanup::tests::abort_preserves_unknown_artifacts_and_rejects_changed_original',
            'project::windows_save_cleanup::tests::recovery_flush_requires_exact_replacement_and_preserves_bytes',
            'project::windows_save_cleanup::tests::interrupted_cleanup_accepts_absence_but_preserves_reused_name',
            'project::windows_save_integration_tests::interrupted_replaced_save_completes_after_database_and_handles_reopen',
            'project::windows_save_integration_tests::interrupted_prepared_save_aborts_after_database_and_handles_reopen',
            'project::windows_save_integration_tests::interrupted_rename_without_receipt_completes_after_reopen',
            'project::windows_save_integration_tests::interrupted_cleanup_before_ledger_completion_recovers_after_reopen',
            'project::windows_tests::application_scheduler_connection_does_not_enable_windows_writes',
            'project::windows_directory_create::tests::retained_directory_create_and_move_never_replace_an_existing_leaf',
            'project::windows_directory_create::tests::read_only_rebind_coexists_with_retained_file_rename_handle',
            'project::windows_streams::tests::default_stream_parser_never_ignores_additional_or_malformed_records',
            'project::windows_streams::tests::named_stream_is_rejected_without_modifying_any_content',
            'project::windows_application::review::intent::windows_writer::metadata::tests::basic_metadata_rejects_special_attributes_and_control_times',
            'project::windows_application::review::intent::windows_writer::metadata::tests::staged_basic_metadata_preserves_source_and_binds_receipt',
            'project::windows_application::review::intent::windows_writer::directories::tests::directory_child_metadata_changes_do_not_allow_identity_or_access_changes',
            'project::windows_application::review::intent::windows_writer::directories::tests::new_directory_stage_is_empty_and_never_reuses_a_name',
            'project::windows_application::review::intent::windows_writer::directories::tests::tree_observation_checks_owned_content_and_rejects_foreign_names',
            'project::windows_application::review::intent::windows_writer::directories::tests::counterpart_recheck_rejects_child_mutation_after_initial_tree_check',
            'project::windows_application::review::intent::windows_writer::directories::tests::child_map_rejects_unsettled_or_preexisting_children',
            'save_recovery_dispatch_tests::windows_save_recovery_gate_rejects_direct_confirmed_requests'
          )
          foreach ($name in $required) {
            if (-not ($tests | Select-String -SimpleMatch "${name}: test")) { throw "Missing regression: $name" }
          }
      - name: Exercise native Windows primitives and save helpers
        run: cargo test --locked --release -p hello-agent-sidecar --lib project::windows_ -- --nocapture
      - name: Reject unactivated recovery through the request dispatcher
        run: cargo test --locked --release -p hello-agent-sidecar --lib save_recovery_dispatch_tests::windows_save_recovery_gate_rejects_direct_confirmed_requests -- --exact --nocapture
      - name: Record limits
        if: always()
        shell: pwsh
        run: |
          @'
          Diagnostic: Windows compilation, native primitives/save helpers, application metadata/directory/stream regressions, seeded snapshot save recovery across file/SQLite reopen, and closed recovery admission.
          Not Git admission or process-kill/startup E2E, packaged UI, power-loss, or release qualification.
          No product activation, packaging, credentials, model calls, or user projects.
          '@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY
