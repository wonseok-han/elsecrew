name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 소개 웹사이트는 데스크톱 앱과 배포 단위가 달라 별도로 검증한다.
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      # rolldown/sharp 등 플랫폼별 네이티브 optional 바이너리는 한 OS에서 만든
      # lock에 아예 안 담긴다(npm/cli#4828) → 다른 OS 러너가 lock을 따르면 못 찾음.
      # lock을 지우고 새로 설치해 러너 OS(linux)용 바이너리를 신선하게 받는다.
      - run: rm -f package-lock.json && npm install --no-audit --no-fund

      - name: 웹사이트 빌드 + 렌더링 테스트
        run: npm test

      - name: 웹사이트 린트
        run: npm run lint

  # 프론트 빌드 + Rust 테스트 (macOS / Windows 동시)
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 기준선 기계 검증 하네스
        run: pnpm test:harness

      # 렌더러 마운트 스모크(가짜 bridge로 작업대 전체 흐름)는 g4·g6 게이트에만 있어
      # 한동안 깨진 채 아무도 돌리지 않았다(2026-11-26). macOS에서만 매번 돌린다.
      # pnpm은 electron postinstall을 막으므로 바이너리를 직접 받는다.
      - name: 렌더러 마운트 스모크 (Electron, macOS)
        if: matrix.os == 'macos-latest'
        run: |
          node node_modules/electron/install.js
          pnpm m5:test:editor

      # 결과 미리보기의 실제 앱 검사(격리 프로브 m5:test:preview-isolation, 화면 스모크
      # m5:test:preview-ui, 기본값 확인 scripts/m5-preview-default-check.mjs)는 CI에서
      # 돌리지 않는다. 화면이 있는 로그인 세션에서 실제 창·네이티브 뷰·포커스를 다루고,
      # 디버그 sidecar 빌드와 수 분의 실행이 필요하다. 미리보기는 macOS에서만 기본으로
      # 켜지고(Windows는 꺼짐, PR #9 검토 I2·I5) 세 검사도 macOS 전용이라 Windows에서는
      # 종료 코드 2(미실행)로 끝난다. 결과는 사람이 macOS에서 돌려 PR에 증거로 남긴다.
      - name: 하네스 증거 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-harness-${{ matrix.os }}
          path: .artifacts/m5-harness/*.json
          if-no-files-found: warn
