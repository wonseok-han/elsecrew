name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 소개 웹사이트는 데스크톱 앱과 배포 단위가 달라 별도로 검증한다.
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      # rolldown/sharp 등 플랫폼별 네이티브 optional 바이너리는 한 OS에서 만든
      # lock에 아예 안 담긴다(npm/cli#4828) → 다른 OS 러너가 lock을 따르면 못 찾음.
      # lock을 지우고 새로 설치해 러너 OS(linux)용 바이너리를 신선하게 받는다.
      - run: rm -f package-lock.json && npm install --no-audit --no-fund

      - name: 웹사이트 빌드 + 렌더링 테스트
        run: npm test

      - name: 웹사이트 린트
        run: npm run lint

  # 프론트 빌드 + Rust 테스트 (macOS / Windows 동시)
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 기준선 기계 검증 하네스
        run: pnpm test:harness

      # 렌더러 마운트 스모크(가짜 bridge로 작업대 전체 흐름)는 g4·g6 게이트에만 있어
      # 한동안 깨진 채 아무도 돌리지 않았다(2026-11-26). macOS에서만 매번 돌린다.
      # pnpm은 electron postinstall을 막으므로 바이너리를 직접 받는다.
      - name: 렌더러 마운트 스모크 (Electron, macOS)
        if: matrix.os == 'macos-latest'
        run: |
          node node_modules/electron/install.js
          pnpm m5:test:editor

      # 결과 미리보기의 실제 앱 검사(격리 프로브 m5:test:preview-isolation, 화면 스모크
      # m5:test:preview-ui, 기본값 확인 scripts/m5-preview-default-check.mjs)는 CI에서
      # 돌리지 않는다. 화면이 있는 로그인 세션에서 실제 창·네이티브 뷰·포커스를 다루고,
      # 디버그 sidecar 빌드와 수 분의 실행이 필요하다. 미리보기는 macOS에서만 기본으로
      # 켜지고(Windows는 꺼짐, PR #9 검토 I2·I5) 세 검사도 macOS 전용이라 Windows에서는
      # 종료 코드 2(미실행)로 끝난다. 결과는 사람이 macOS에서 돌려 PR에 증거로 남긴다.
      # 응답 시간 진단(m5:measure:latency)도 CI에서 돌리지 않는다: 실제 창에서 파일 트리를
      # 눌러 여는 시간을 재고, 디버그 sidecar와 약 10분이 필요하며 macOS 전용이다. G6 게이트가
      # 아니다(fake 공급자에는 승인 큐가 없음, PR #15 검토 B1).
      - name: 하네스 증거 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-harness-${{ matrix.os }}
          path: .artifacts/m5-harness/*.json
          if-no-files-found: warn

  # sidecar 전체 시험(위 하네스는 공용 코어·protocol만 돈다, PR #4·#18 보고).
  # 한 job이면 macOS 3코어에서 30분 가까이 걸려 넷으로 나눈다. 2026-11-27 로컬
  # 시험별 시간(CPU 초): storage::tests 1953(compaction_writer_v10 592 +
  # reopen_projection 295), chat::tests 971, 나머지 약 770(project::tests 420,
  # 통합 시험 stdio_process 포함). 이름 필터와 --skip이 정확히 나누므로 빠지는
  # 시험도 겹치는 시험도 없다. 시험이 늘면 묶음을 이 표대로 다시 나눈다.
  # macOS만: 상당수 시험이 macOS 전용(cfg)이고 Windows 실제 실행은 꺼져 있다.
  sidecar:
    name: sidecar (macos, ${{ matrix.shard.name }})
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { name: storage-a, filter: "storage::tests::compaction_writer_v10 storage::tests::reopen_projection" }
          - { name: storage-b, filter: "storage::tests --skip storage::tests::compaction_writer_v10 --skip storage::tests::reopen_projection" }
          - { name: chat, filter: "chat::tests" }
          - { name: rest, filter: "--skip storage::tests --skip chat::tests" }
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_INCREMENTAL: 0
      RUST_TEST_THREADS: 3
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sidecar-macos

      # lib 시험이 같은 target의 sidecar 실행 파일을 띄운다(sidecar_binary()).
      - name: sidecar 실행 파일
        run: cargo build -p elsecrew-sidecar --locked --bin elsecrew-sidecar

      - name: sidecar 시험 (${{ matrix.shard.name }})
        run: cargo test -p elsecrew-sidecar --locked -- ${{ matrix.shard.filter }}

      # 네이티브 스모크(실제 sidecar, 격리 앱 데이터, 공급자 없음): 디버그 sidecar를
      # 이미 만든 rest 묶음에서만 돈다. 프로젝트 화면 기본 흐름과 합치기·다시
      # 불러오기, 여러 프로젝트 동시 작업. 시험 단계가 실패해도 따로 돈다.
      - uses: pnpm/action-setup@v4
        if: ${{ !cancelled() && matrix.shard.name == 'rest' }}
        with:
          version: 11

      - uses: actions/setup-node@v4
        if: ${{ !cancelled() && matrix.shard.name == 'rest' }}
        with:
          node-version: 22
          cache: pnpm

      - name: 네이티브 스모크 (Electron, macOS)
        if: ${{ !cancelled() && matrix.shard.name == 'rest' }}
        run: |
          pnpm install --frozen-lockfile
          node node_modules/electron/install.js
          node scripts/m5-multiproject-ui-run.mjs --build
          node_modules/.bin/electron scripts/m5-project-ui-smoke.cjs
          ELSECREW_SMOKE_APPLY=1 ELSECREW_SMOKE_RELOAD=1 node_modules/.bin/electron scripts/m5-project-ui-smoke.cjs
