name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 소개 웹사이트는 데스크톱 앱과 배포 단위가 달라 별도로 검증한다.
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      # rolldown/sharp 등 플랫폼별 네이티브 optional 바이너리는 한 OS에서 만든
      # lock에 아예 안 담긴다(npm/cli#4828) → 다른 OS 러너가 lock을 따르면 못 찾음.
      # lock을 지우고 새로 설치해 러너 OS(linux)용 바이너리를 신선하게 받는다.
      - run: rm -f package-lock.json && npm install --no-audit --no-fund

      - name: 웹사이트 빌드 + 렌더링 테스트
        run: npm test

      - name: 웹사이트 린트
        run: npm run lint

  # 프론트 빌드 + Rust 테스트 (macOS / Windows 동시)
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 기준선 기계 검증 하네스
        run: pnpm test:harness

      - name: 하네스 증거 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-harness-${{ matrix.os }}
          path: .artifacts/m5-harness/*.json
          if-no-files-found: warn
